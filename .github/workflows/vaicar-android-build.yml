name: VaiCar native Android build

on:
  push:
    branches: [vaicar-next]
    paths: ["app/**", "*.gradle.kts", "settings.gradle.kts", "gradle.properties", ".github/workflows/vaicar-android-build.yml"]
  pull_request:
    branches: [vaicar-next]
    paths: ["app/**", "*.gradle.kts", "settings.gradle.kts", "gradle.properties", ".github/workflows/vaicar-android-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vaicar-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Android unit tests (Passenger + Driver)
        run: gradle --no-daemon :app:testPassengerDebugUnitTest :app:testDriverDebugUnitTest

      - name: Build independent debug APKs (Passenger + Driver)
        run: gradle --no-daemon :app:assemblePassengerDebug :app:assembleDriverDebug

      - name: Package and verify APK manifests & checksums
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/passenger/debug/app-passenger-debug.apk artifacts/VaiCar-Passageiro-debug.apk
          cp app/build/outputs/apk/driver/debug/app-driver-debug.apk artifacts/VaiCar-Motorista-debug.apk

          AAPT2=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name aapt2 2>/dev/null | sort -V | tail -n 1)
          echo "=== APK Build Manifest ===" > artifacts/build-manifest.txt
          echo "Commit: ${{ github.sha }}" >> artifacts/build-manifest.txt
          echo "Branch: ${{ github.ref_name }}" >> artifacts/build-manifest.txt
          echo "BuiltAt: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> artifacts/build-manifest.txt
          echo "" >> artifacts/build-manifest.txt
          ls -lh artifacts/*.apk >> artifacts/build-manifest.txt
          echo "" >> artifacts/build-manifest.txt
          sha256sum artifacts/*.apk >> artifacts/build-manifest.txt

          if [ -n "$AAPT2" ]; then
            echo "" >> artifacts/build-manifest.txt
            echo "=== aapt2 badging: VaiCar-Passageiro-debug.apk ===" >> artifacts/build-manifest.txt
            "$AAPT2" dump badging artifacts/VaiCar-Passageiro-debug.apk | grep -E "package:|application-label:|uses-permission:|sdkVersion:|targetSdkVersion:" >> artifacts/build-manifest.txt
            echo "" >> artifacts/build-manifest.txt
            echo "=== aapt2 badging: VaiCar-Motorista-debug.apk ===" >> artifacts/build-manifest.txt
            "$AAPT2" dump badging artifacts/VaiCar-Motorista-debug.apk | grep -E "package:|application-label:|uses-permission:|sdkVersion:|targetSdkVersion:" >> artifacts/build-manifest.txt

            "$AAPT2" dump badging artifacts/VaiCar-Passageiro-debug.apk | grep "name='com.vaicar.passenger'"
            "$AAPT2" dump badging artifacts/VaiCar-Motorista-debug.apk | grep "name='com.vaicar.driver'"
          fi

          cat artifacts/build-manifest.txt
          {
            echo "## VaiCar Android Independent APKs"
            echo '```'
            cat artifacts/build-manifest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload VaiCar Passageiro Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VaiCar-Passageiro-debug-apk
          path: |
            artifacts/VaiCar-Passageiro-debug.apk
            artifacts/build-manifest.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload VaiCar Motorista Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VaiCar-Motorista-debug-apk
          path: |
            artifacts/VaiCar-Motorista-debug.apk
            artifacts/build-manifest.txt
          if-no-files-found: error
          retention-days: 30
